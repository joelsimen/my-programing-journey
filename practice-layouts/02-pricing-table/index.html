<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing Table</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="heading">Choose your plan</h1>
  <div class="pricing">
    <div class="plan">
      <h2>Basic</h2>
      <p class="price">$9<span>/mo</span></p>
      <ul>
        <li>5 Projects</li>
        <li>2GB Storage</li>
        <li>Email Support</li>
      </ul>
      <button class="btn">Choose Basic</button>
    </div>
    <div class="plan featured">
      <span class="badge">Most Popular</span>
      <h2>Pro</h2>
      <p class="price">$29<span>/mo</span></p>
      <ul>
        <li>Unlimited Projects</li>
        <li>50GB Storage</li>
        <li>Priority Support</li>
      </ul>
      <button class="btn">Choose Pro</button>
    </div>
    <div class="plan">
      <h2>Premium</h2>
      <p class="price">$59<span>/mo</span></p>
      <ul>
        <li>Unlimited Everything</li>
        <li>500GB Storage</li>
        <li>24/7 Support</li>
      </ul>
      <button class="btn">Choose Premium</button>
    </div>
  </div>
</body>
</html>
