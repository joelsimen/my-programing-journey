<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accordion FAQ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="faq">
    <h1>Frequently Asked Questions</h1>

    <div class="faq-item">
      <button class="faq-question">How long does shipping take? <span>+</span></button>
      <div class="faq-answer"><p>Orders typically arrive within 3-5 business days depending on location.</p></div>
    </div>

    <div class="faq-item">
      <button class="faq-question">Can I return a product? <span>+</span></button>
      <div class="faq-answer"><p>Yes, we accept returns within 30 days of delivery, no questions asked.</p></div>
    </div>

    <div class="faq-item">
      <button class="faq-question">Do you ship internationally? <span>+</span></button>
      <div class="faq-answer"><p>Yes, we currently ship to over 40 countries worldwide.</p></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
