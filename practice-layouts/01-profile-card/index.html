<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <img class="avatar" src="https://picsum.photos/id/64/200/200" alt="Profile photo">
    <h1 class="name">Amara Ndifon</h1>
    <p class="role">Front-End Developer</p>
    <p class="bio">I build clean, fast interfaces and I'm currently sharpening my HTML/CSS/JS fundamentals one layout at a time.</p>
    <div class="socials">
      <a href="#" aria-label="Twitter">🐦</a>
      <a href="#" aria-label="GitHub">💻</a>
      <a href="#" aria-label="LinkedIn">🔗</a>
    </div>
    <button class="btn">Follow</button>
  </div>
</body>
</html>
