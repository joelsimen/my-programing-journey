<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tabs-wrapper">
    <div class="tab-buttons">
      <button class="tab-btn active" data-tab="tab1">Description</button>
      <button class="tab-btn" data-tab="tab2">Specs</button>
      <button class="tab-btn" data-tab="tab3">Reviews</button>
    </div>
    <div class="tab-content active" id="tab1">
      <p>This product is built with durable materials and designed for everyday use.</p>
    </div>
    <div class="tab-content" id="tab2">
      <p>Weight: 1.2kg | Dimensions: 30x20x10cm | Material: Aluminum</p>
    </div>
    <div class="tab-content" id="tab3">
      <p>⭐⭐⭐⭐⭐ "Exactly what I needed." — Verified buyer</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
